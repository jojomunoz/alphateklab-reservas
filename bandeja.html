<script>try{var d=document.documentElement,t=localStorage.getItem('atk-reservas-pref-tema'),p=localStorage.getItem('atk-reservas-pref-plantilla');if(t==='claro'||t==='oscuro')d.dataset.tema=t;if(p==='consultorio'||p==='barberia'||p==='taller')d.dataset.marca=p}catch(e){}</script>
